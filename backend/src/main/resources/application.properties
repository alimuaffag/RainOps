spring.application.name=RainOps
spring.config.import=optional:file:.local/database.properties,optional:file:../.local/database.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/rainops}
spring.datasource.username=${DB_USERNAME:rainops}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=true
