server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rainops_demo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
rainops.demo.username=${DEMO_USERNAME:reviewer}
rainops.demo.password=${DEMO_PASSWORD}
rainops.demo.seed=${DEMO_SEED:false}
